{{ define "main" }}
<div class="container page-content" style="min-height: 55vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4.5rem 1.5rem 3rem;">
  <span style="font-family: var(--font-mono); font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); background: var(--chip-bg); border: 1px solid var(--chip-border); padding: 0.3rem 0.85rem; border-radius: 9999px; margin-bottom: 1.5rem; display: inline-block;">
    404 &middot; Not Found
  </span>
  <h1 class="hero-name" style="font-size: 3rem; font-weight: 700; margin-bottom: 1rem; line-height: 1.15;">
    Page Not Found
  </h1>
  <p style="color: var(--text-secondary); max-width: 520px; font-size: 1.05rem; line-height: 1.6; margin-bottom: 2.25rem;">
    The page you are looking for might have been moved, renamed, or doesn't exist on this manifold.
  </p>
  <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center;">
    <a href="/" class="hero-btn hero-btn-primary" style="display: inline-flex; align-items: center; gap: 0.45rem;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      Return Home
    </a>
    <a href="/publications/" class="hero-btn" style="display: inline-flex; align-items: center; gap: 0.45rem;">
      Publications
    </a>
    <a href="/posts/" class="hero-btn" style="display: inline-flex; align-items: center; gap: 0.45rem;">
      Blog
    </a>
  </div>
</div>
{{ end }}

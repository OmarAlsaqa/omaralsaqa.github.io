{{ define "main" }}
<div class="container page-content">
  <div class="section-top-row" style="margin-bottom: 2rem;">
    <div>
      <h1 class="hero-name" style="font-size: 2.4rem; margin-bottom: 0.5rem;">Topics &amp; Tags</h1>
      <p style="color: var(--text-secondary); font-size: 1.05rem;">
        Explore research articles, notes, and writings by topic.
      </p>
    </div>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
    {{ range .Data.Terms.ByCount }}
      <a href="{{ .Page.RelPermalink }}" class="tag-pill" style="font-size: 0.95rem; padding: 0.45rem 1rem;">
        {{ .Page.Title }} <span style="opacity: 0.6; font-size: 0.8rem; margin-left: 0.25rem;">({{ .Count }})</span>
      </a>
    {{ end }}
  </div>
</div>
{{ end }}
